# respeak shorthand lexicon — the machine-facing lane's canonical dictionary.
#
# Modeled on codified expert shorthands (brevity codes, Q-codes, ATC
# phraseology): the swarm may only rely on shorthand that appears HERE with
# status: ratified. Anything else must be written out in full.
#
# Following the long-running-harness lesson (structured registries resist
# drift better than prose), this file is append-mostly:
#   - agents PROPOSE entries by writing files into .claude/respeak/proposals/
#   - ratification (human or auto, per config) moves them here
#   - entries are never deleted, only status: retired
#
# Entry fields:
#   term:        the shorthand token as it appears in swarm traffic; no
#                whitespace and none of ` $ ; | & < > " ' \ (the scripts refuse it)
#   expansion:   the full-English rendering the translator substitutes
#   definition:  precise meaning, including what it does NOT cover
#   scope:       where it is valid (global | repo | session)
#   status:      proposed | ratified | retired
#   ratified_by: human|auto + date
#   reviewed:    the date a person last reviewed the entry (YYYY-MM-DD);
#                absent, the review clock runs from ratified_by's date
#   uses:        not read; leave it at 0. A use is a line in the project's
#                use record, .claude/respeak/uses.jsonl, which
#                `scripts/respeak-lexicon.py use` appends
#   legibility:  0.0-1.0 estimate of how guessable it is without the lexicon
#                (entries below config's legibility_floor are rejected)
#
# Top-level `audited:` (YYYY-MM-DD, beside `version:`) is the date of the
# last fresh-decoder audit; a person writes it, as `reviewed:`.
# `scripts/respeak-lexicon.py due` reads both, and the clean uses, and
# names the entries due to retire or for review and whether the audit is.

version: 0

entries:
  # Seed examples showing the shape. These three are near-universal agent
  # conventions already, so they start ratified with high legibility.
  - term: "cfg"
    expansion: "configuration"
    definition: "Any respeak configuration value; not general app config."
    scope: repo
    status: ratified
    ratified_by: human 2026-08-31
    uses: 0
    legibility: 0.9
  - term: "R1..R7"
    expansion: "research dimension 1-7"
    definition: "The seven wide-net research dimensions from the 2026-08-31 research run (deai-language, token-compression, linguistics, communication-practices, style-as-code, claude-code-integration, landscape-and-media)."
    scope: repo
    status: ratified
    ratified_by: human 2026-08-31
    uses: 0
    legibility: 0.5
  - term: "2-lane"
    expansion: "two-lane architecture"
    definition: "The core architecture: machine-facing shorthand lane + human-facing narrative lane."
    scope: repo
    status: proposed
    uses: 0
    legibility: 0.6 # rewritten from "2L" (0.4) which sat below the 0.5 floor —
                    # the librarian picks the variant closest to plain English
