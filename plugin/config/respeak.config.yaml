# respeak configuration — the exposed influence surface.
# v1: applies research/synthesis/config-critique.md (evidence citations there).
# Contract: every parameter maps to observable writing behavior
# (corpus/style/tone-mapping.md); a knob with no behavioral mapping is
# decoration and gets removed.
#
# This file is the LOWEST layer of a layered configuration (docs/config-layers.md).
# Above it, nearest to the target wins: the plugin's userConfig, the user's
# ~/.claude/respeak/config.yaml, the project's .claude/respeak/config.yaml
# (+ config.local.yaml and its `scopes:`), then any .respeak.yaml in the
# folders between the project root and the file being written or rendered.
# Resolve what applies somewhere with:
#   bash scripts/respeak-config.sh explain --for docs/exec/q3.md
# Keys marked "project-only" below are ignored when a user or folder layer
# sets them.

version: 3
schema: docs/respeak.config.schema.json # not yet written; `respeak-config.sh validate` checks shape + policy

editorial_pass:
  # Governs in-place edits to existing documents (as opposed to translation,
  # which generates fresh narrative and always leads with the outcome).
  #
  # restructure:
  #   advise — never move sections; when the buried-lede test fails, report a
  #            structure advisory: the proposed section order plus a drafted
  #            lead paragraph the author can paste in. Headings stay stable, so
  #            anchors and inbound links survive.
  #   apply  — may reorder sections, retitle headings, and rewrite the lead.
  #            Only when the caller owns relinking (e.g. a whole-wiki pass);
  #            verify such edits with respeak-verify-edit.py --allow-restructure
  #            and list every moved/retitled anchor in the edit report.
  #   off    — prose gates only; structure untouched and unreported.
  restructure: advise
  # The buried-lede test: a reader who stops at this boundary must already
  # know the document's outcome/decision/ask and whether to keep reading.
  buried_lede_boundary: first_paragraph # first_paragraph | first_n_sentences: N
  # In apply mode, an abstract/BLUF block at the top may substitute for
  # reordering when moving sections would cost more than it buys.
  prefer_abstract_over_reorder: true
  # What respeak-check.sh --verify hands respeak-verify-edit.py for each
  # changed file, on top of `restructure: apply` (--allow-restructure).
  verify:
    prose_keys: []        # leaf key names whose string values an editorial pass
                          # may reword in Markdown front matter and in .yaml files
                          # (--prose-keys); ["*"] = every string leaf. Numbers,
                          # URLs, code spans, and link targets inside them stay
                          # invariant either way.
    allow_strings: false  # .py page generators: string-literal content may
                          # change (--allow-strings); nothing else in the file may
    paths: []             # git pathspecs, relative to the project, of the
                          # non-Markdown files the check verifies as well, e.g.
                          # ["deploy/*.py", "catalog/**/*.yaml"]; never gated

data:
  # Rendering rules for homogeneous data (lists of records, metrics, results).
  # "Crisp visibility": the reader sees the decision-relevant facts before
  # the detail rows, in a shape built for scanning, not narration.
  table_over_prose_threshold: 4 # >= N homogeneous items render as a table,
                                # never as prose or a bullet run
  key_column_first: true        # the column the reader decides on leads
  summary_first: true           # totals / deltas / verdict line precede detail
  outlier_callout: true         # a decision-relevant outlier is named in one
                                # sentence above the table, never buried mid-rows
  max_bullets_per_list: 7       # longer lists become tables or get grouped
  sort_by: decision_relevance   # decision_relevance | magnitude | source_order

narrative:
  profile: peer-engineer  # a name from `profiles:` below. Sugar: the profile's
                          # fields (tech_level, default_mode, lexicon_access,
                          # reading_level_grade, address) are filled in UNDER
                          # any explicit key written in the same file/layer, so
                          # a folder file saying `profile: exec` plus
                          # `tech_level: 2` gets exec's mode with tech_level 2.
  default_mode: technical # eli5 | bluf | technical
  mode_select: fixed      # fixed | compass (Diátaxis 2-question classifier, opt-in)
  auto_narrative: false   # Stop hook nudges a one-paragraph narrative after
                          # milestone turns (scripts/stop-narrative.sh); also
                          # settable at install: --config auto_narrative=true.
                          # RESPEAK_HOOKS=off or /respeak:off silences the hook
                          # for one session (docs/config-layers.md, Session overrides)
  context_default: routine # per-invocation: incident | routine | celebration
                           # (Mailchimp: tone conditions on reader state;
                           #  incident forces plain language + decompression)
  tone:
    formality: 0.4   # 0 = conversational, 1 = formal register
    directness: 0.9  # 0 = cushioned, 1 = conclusion-first
    confidence: 0.8  # hedging control; uncertainty stated once, precisely
    # warmth removed in v1 — bare scalar with the weakest external mapping;
    # replaced by the checkable style.feedback block (Radical Candor CORE).
  tech_level: 3 # 1-5 audience depth; see tone-mapping.md

# A profile encodes the audience's common ground (Clark & Brennan).
# It composes with a mode (document form) and a context (reader state).
# Voice constants in style: never vary.
profiles:
  exec:
    tech_level: 1
    lexicon_access: forbidden
    reading_level_grade: 9
    default_mode: bluf
    address: you
  peer-engineer: # fills the tech_level-3 gap the three modes leave open
    tech_level: 3
    lexicon_access: expand-first-use
    reading_level_grade: null
    default_mode: technical
    address: you
  author: # tech_level-5: the opt-in shorthand reader
    tech_level: 5
    lexicon_access: inline # the only profile where the two lanes may converge
    reading_level_grade: null
    default_mode: technical
    address: you

modes:
  eli5:
    tech_level: 1
    reading_level_grade: 6 # a register cue for the translator; no script
                           # computes it (see style.readability_metrics)
    max_sentence_words: 15
    length_budget_words: 150
    max_paragraphs: 1
    structure: single-explanation # no headers; no bullets
    data: summarize-only # never tables: state the one comparison the reader
                         # cares about; the data block does not apply here
    address_reader: true          # "you" — plainlanguage #14
    common_ground_opener: true    # Maxwell: open with something the reader knows
    metaphor_budget: 1            # the one paid-for analogy...
    analogy_must_close: true      # ...and it must say what it maps to
    lexicon_terms: forbidden      # zero shorthand, zero undefined abbreviations
    contractions: allowed
    checks: # LLM-judge checks, not lint
      - understand-feel-do        # what happened / why you care / what next
      - no-parenthetical-asides
    output_glob: "out/eli5/**/*.md"
    tone: { formality: 0.2 } # crosses a behavior band in tone-mapping.md

  bluf:
    tech_level: 2
    reading_level_grade: 9 # a register cue, not computed (as eli5)
    max_sentence_words: 20 # a cap; AR 25-50 (10 Oct 2020) 1-39 asks ~15 on average
    length_budget_words: 200
    max_paragraph_sentences: 6 # STE
    structure: bluf # sentence 1 = the decision/result/ask; no preamble
    require_ask: # AR 25-50 canonical ask
      owner: true
      deadline: true
      allow_fyi_no_action: true # explicit "FYI only — no action needed" satisfies it
    address_reader: true
    metaphor_budget: 0 # GOV.UK: metaphors slow comprehension
    bullets: # GOV.UK bullet discipline
      lead_in_required: true
      min_items: 2
      max_sentences_per_item: 1
    grouping: mece # Minto: siblings must not overlap, none missing
    scqa_preamble_max_clauses: 1
    checks:
      - delete-test # sentence 1 alone must carry outcome + expectation
      - answer-the-question-asked # if you can't, say why
    output_glob: "out/bluf/**/*.md"

  technical:
    tech_level: 4
    reading_level_grade: 12 # UNVERIFIED number — prior art says "a ceiling
                            # exists" (Hemingway Technical preset), names none.
                            # Not computed: see style.readability_metrics.
    max_sentence_words: 25  # was 28 — above every standard; STE descriptive cap
    max_step_words: 20      # STE procedural cap
    length_budget_words: 500
    max_paragraph_sentences: 6  # STE
    max_paragraph_words: 150    # plainlanguage (hard cap 250)
    structure: finding-first    # conclusion → evidence file:line → open questions
    open_questions_require_test: true # end claims with a falsifiable check
    metaphor_budget: 0
    lexicon_terms: expand-first-use # ratified terms free after first expansion
    passive_allowed_when: agent-unknown # STE descriptive rule; never for style
    procedural: # applies to embedded steps in any mode
      active_voice: 1.0 # STE: instructions 100% active/imperative
      one_instruction_per_sentence: true
      numbered_steps: true # GOV.UK: numbered steps, not bullets, for processes
      safety_lines_first: true
    checks:
      - facts-before-stories # first evidence-bearing sentence is a fact, not a verdict
    output_glob: "out/technical/**/*.md"

style:
  banned_phrases: corpus/banned-phrases.yaml
  replacements: corpus/replacements.yaml
  rules: corpus/style/
  no_pleasantries: true
  no_self_narration: true
  person: second     # plainlanguage #14
  tense: present     # plainlanguage #4
  contractions: allowed
  negative_contractions: never # GOV.UK: "cannot", never "can't" — misread as opposite
  positive_form: true          # no double negatives
  same_term_same_concept: true # plainlanguage #11 + STE; lint against lexicon
  quoting_exempt: true         # quotes/code blocks exempt from bans
  readability_metrics: [flesch_kincaid, gunning_fog] # DECLARED, NOT COMPUTED:
                        # no script computes a grade; respeak-measure.py counts
                        # sentence length and em-dash density only. Formulas
                        # track rated difficulty weakly on specialist text
                        # (Zheng and Yu 2017, JMIR 19(3):e59: r 0.10 to 0.41),
                        # so the sentence and paragraph budgets are the checks.
  min_alert_level: { ci: error, interactive: warn }
  budgets: # budgets, not bans (Hemingway model)
    passive_per_10_sentences: 2 # replaces active_voice_min; procedural override = 0
    adverb_intensifiers_per_100_words: 1 # very/really/extremely
    qualifiers_per_message: 1   # one precise uncertainty statement
    exclamations_per_doc: 0     # Google
    # The four keys below are read by respeak-measure.py's --config; each
    # maps to one measured field there (BUDGET_DEFAULTS), and a FAIL counts
    # as a warn-level hit for --fail-on. Not yet enforced against the
    # per-message budgets above (passive/adverb/qualifier/exclamation) —
    # those stay LLM-judge checks, not lint, until they have a cheap local
    # scan of their own.
    warn_phrases_per_1000_words: 5 # -> density_per_1000_words (tier: density hits;
                                   # warn-severity matches as density, not ban)
    emdash_per_1000_words: 5       # -> em_dashes_per_1000_words
    avg_sentence_words: 20         # -> avg_sentence_words
    max_sentence_words: 35         # -> max_sentence_words (distinct from the mode
                                   # contracts' max_sentence_words above, which are
                                   # LLM-judge writing targets, not this lint cap)
  feedback: # the checkable form of warmth (Radical Candor)
    core_required: true            # context + observation + result + next step
    specific_praise_required: true # bare "looks good" = Ruinous Empathy
    behavior_not_person: true

gate:
  # Enforcement of style.budgets and the banned-phrase corpus on Write|Edit,
  # via the PostToolUse hook scripts/respeak-gate.sh (hooks/hooks.json).
  # Every knob here maps to that script's behavior — no knob without a
  # behavior, same contract as the rest of this file.
  #
  # The gate is per-project OPT-IN: this plugin-level default is `enabled:
  # false`, and the hook itself does nothing unless a project's own
  # `.claude/respeak/config.yaml` sets `enabled: true` (skills/init/SKILL.md
  # seeds that file from this one, with the gate left off; a human turns it
  # on once the project trusts its excludes/allow list). This file is never
  # the one the hook reads for enforcement decisions on someone else's repo.
  #
  # Session overrides sit above every layer (docs/config-layers.md, "Session
  # overrides"): RESPEAK_GATE=off|on and RESPEAK_HOOKS=off for one launch,
  # /respeak:off [gate] and /respeak:on [gate] for the session you are in.
  # `on` applies this block with `enabled` forced true; nothing else changes.
  enabled: false        # project-only: a user or folder layer cannot turn it on
  include: ["**/*.md"] # project-only. globs, matched relative to the project dir.
                        # The gate covers Markdown files only (.md .markdown .mdx,
                        # any case); include/exclude narrow within that set, so
                        # .mdx/.markdown are gated only when listed. [] = nothing.
  exclude: []           # project-only. e.g. ["research/**"]; appends across layers
  fail_on: error         # none | warn | error — passed straight to
                        # respeak-measure.py --fail-on. Any layer may set it,
                        # so a folder can soften to `warn` for its own files.
  block_on: introduced   # introduced | any — what the verdict is measured
                        # against. `introduced` hands measure a --baseline of
                        # the file as it was (the committed version, else the
                        # pre-edit text rebuilt from the Edit, else empty) and
                        # blocks only on hits the write added, so a document
                        # that already carries one — a banned term inside a
                        # heading, which the editorial pass may not move —
                        # stays editable, and the model is told about the
                        # leftovers instead. `any` gates the whole file, the
                        # behavior before v0.6. Any layer may set it.
                        # `respeak-gate.sh --file` is whole-file either way.
  allow: []              # regexes; appends across layers (a user-level allow
                        # for a domain vocabulary is legitimate). A corpus
                        # rule whose pattern/phrase matches
                        # one of these is skipped for this project only (the
                        # escape hatch for a domain term the shared corpus
                        # exceptions: don't cover yet — file the gap rather
                        # than leaving this as the permanent fix)

hooks:
  # Which of the plugin's always-on hooks speak. The gate and the Stop nudge
  # keep their own keys (gate.enabled, narrative.auto_narrative).
  session_start: false  # true: the SessionStart hook (scripts/lexicon-status.sh)
                        # names the lexicon and its ratified-term count at each
                        # session start, in a project with .claude/respeak/.
                        # Any layer may set it; RESPEAK_HOOKS=off and
                        # /respeak:off still silence it.

shorthand: # project-only: governance never varies by folder or by user
  # The resolver merges every key below; each is tagged with what holds it.
  #   [instruction-only] the translator agent's prompt names it; no script checks it
  #   [fixed path]       the scripts and the agent use a fixed path; this key is not read
  #   [respeak-lexicon.py VERB] scripts/respeak-lexicon.py reads it in that verb
  # A key nothing reads is not shipped (a knob with no behaviour is removed). A
  # file that sets an unknown key gets: dropped as project-only from a user or
  # folder layer, merged and unread from a project layer.
  lexicon: corpus/lexicon.yaml # [fixed path] .claude/respeak/lexicon.yaml, else this seed
  max_entries: 150 # [respeak-lexicon.py check, ratify] the cap on ratified entries, the digest's terms
  min_token_edit_distance: 2 # [respeak-lexicon.py check, ratify] Levenshtein, case-folded, each ratified pair
  reserved_metawords: [CORRECTION, SAY-AGAIN, UNVERIFIED] # [respeak-lexicon.py check, ratify] the repair
                      # channel, never_compress's reserved-metawords: words with no whitespace or shell
                      # character; a ratified term nearer one than min_token_edit_distance is a problem,
                      # a proposed one not eligible. [instruction-only] the agent passes each verbatim
  register_marker: required # required | optional. [instruction-only] when required, a narrative keeping a
                            # ratified term unexpanded ends its marker line ` · shorthand`;
                            # [respeak-lexicon.py check] a value outside the two exits 2
  readback_required_for: [irreversible-actions, security-findings, escalations-to-human] # [respeak-lexicon.py use]
                      # slugs, checked each call; `use --for CLASS` refuses a class not listed, or a
                      # clean use without --readback. [instruction-only] a use in an item of a listed
                      # class is clean only with readback, its item adding ` for <class>`
  decompress_on: [escalation-to-human, incident, repeated-fidelity-failure, new-partner] # [respeak-lexicon.py use]
                      # only these four, checked each call; with repeated-fidelity-failure, `use` names
                      # a term with 2 failure uses. [instruction-only] the agent expands every term in
                      # a listed case, whatever narrative.lexicon_access says
  proposal_dir: .claude/respeak/proposals/ # [fixed path] in the project, never the plugin
  ratification: human # human | auto. [instruction-only]: the agent never ratifies;
                      # [respeak-lexicon.py check, ratify] a value outside the two exits 2; ratify prints it
  legibility_floor: 0.5 # [instruction-only] the agent proposes nothing below it;
                        # [respeak-lexicon.py ratify] an entry below it is not eligible
  auto: # [respeak-lexicon.py ratify] when a proposed entry is eligible; ratify writes nothing
    uses: 5                       # clean uses in .claude/respeak/uses.jsonl
    fidelity_failures_allowed: 0  # failure uses it may have
    readback_evidence: true       # true: only a clean use recorded with readback counts
  retire_after_days_unused: 180 # [respeak-lexicon.py due] a ratified entry with no clean use this long is due to retire
  review_cadence_days: 90 # [respeak-lexicon.py due] a ratified entry unreviewed this long is due for review
  legibility_audit: # [respeak-lexicon.py due] the lexicon's `audited:` date this old, the audit is due
    cadence_days: 30       # days between audits
    method: fresh-decoder  # the only method: a fresh agent decodes the sample unaided
    sample: 10             # ratified terms put to it, chosen by the day
  # never_compress: [instruction-only] the agent keeps each class verbatim;
  # respeak-verify-edit.py also holds numbers across an editorial pass.
  # reserved-metawords is the list shorthand.reserved_metawords names.
  never_compress: # TJC do-not-use format: each ban carries its failure story
    - { class: error-messages-and-stack-traces, failure_mode: verbatim evidence lost }
    - { class: security-findings, failure_mode: high-stakes content must survive any reader }
    - { class: user-quotes, failure_mode: misattribution }
    - { class: numbers-with-units, failure_mode: bare magnitudes; TJC trailing-zero precedent }
    - { class: safety-and-caution-instructions, failure_mode: never buried or shortened (STE) }
    - { class: ask-owner-and-deadline, failure_mode: BLUF ask stripped in compression }
    - { class: identifiers-novel-decisions-negations, failure_mode: high-surprisal content is where short encodings become unrecoverable (Piantadosi 2011) }
    - { class: reserved-metawords, failure_mode: repair channel must never be repurposed }

scopes: [] # path-scoped overrides declared centrally, the analog of a
           # .claude/rules/*.md `paths:` frontmatter. Each entry needs `paths`
           # (globs relative to the directory that owns this file; `**` = any
           # depth, a trailing `/` = the folder and everything in it) plus the
           # keys it overrides; later entries win. A .respeak.yaml inside a
           # matching folder wins over all of them (it is nearer). Example:
           #   - paths: ["docs/**"]
           #     narrative: { profile: peer-engineer }
           #   - paths: ["docs/exec/**", "reports/**"]
           #     narrative: { profile: exec }
           #     gate: { fail_on: warn }
